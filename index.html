    .control-group select {

    .analysis-btn { background: var(--bg-primary); color: var(--text-primary); }
    .factures-btn { background: #7b1fa2; color: white; }
    .badge {
      background: #c62828; color: white; border-radius: 50%; padding: 2px 6px;
      font-size: 0.7em; margin-left: 5px; display: inline-block; vertical-align: top;
    }
    .global-summary-bar {
      display: flex; justify-content: space-between; background: var(--summary-bar-bg);
      border-radius: 10px; padding: 12px 15px; margin-bottom: 20px; border: 1px solid var(--border-control);

    .summary-item { text-align: center; flex: 1; }
    .summary-label { font-size: 0.8em; opacity: 0.8; }
    .summary-value { font-size: 1.1em; font-weight: 700; }
    .summary-value.entrees { color: #2e7d32; } .summary-value.sorties { color: #c62828; }
    .form-card { background: var(--bg-form); border-radius: 10px; padding: 20px; margin-bottom: 20px; border: 1px solid var(--border-form); }
    .form-group { margin-bottom: 12px; display: flex; flex-direction: column; }
    label { font-weight: 500; margin-bottom: 4px; font-size: 0.9em; color: var(--text-color); }
    input, select {
      padding: 10px 12px; border: 1px solid var(--border-input); border-radius: 8px;

    .hidden { display: none; }
    .period-selector {

    .period-selector label { font-weight: 600; }

    document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.getAttribute("data-i18n")); });
    const typeSelect = document.getElementById("typeSelect");
    if (typeSelect) { typeSelect.options[0].textContent = t("type_expense"); typeSelect.options[1].textContent = t("type_income"); }
    updateAuthUIMode();
    if (!document.getElementById("mainApp").classList.contains("hidden")) refreshUI();
    if (!document.getElementById("analysisScreen").classList.contains("hidden")) refreshAnalysis();
    if (!document.getElementById("facturesScreen").classList.contains("hidden")) refreshFactures();
    if (!document.getElementById("profileScreen").classList.contains("hidden")) refreshProfile();
  }

  // ===================== AUTHENTIFICATION SUPABASE =====================
  let authMode = "login";

  async function handleAuth() {
    const email = document.getElementById("authEmail").value.trim();
    const password = document.getElementById("authPassword").value;
    if (!email || !password) { document.getElementById("authError").textContent = t("error_fill_all"); return; }
    // Vérification simple du format email
    if (!email.includes('@')) { document.getElementById("authError").textContent = t("error_email_invalid"); return; }

    try {
      if (authMode === "register") {
        const { data, error } = await supabase.auth.signUp({ email, password });
        if (error) throw error;
        // L'utilisateur doit peut-être confirmer son email (selon configuration Supabase)
        alert("Inscription réussie ! Vérifiez votre boîte mail si la confirmation est demandée.");
        // On repasse en mode connexion
        authMode = "login";
        updateAuthUIMode();
      } else {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
        // Connecté, on charge l'application principale
        showMainApp();
      }
    } catch (error) {
      document.getElementById("authError").textContent = error.message;
    }
  }

  async function logout() {
    await supabase.auth.signOut();
    showAuthScreen();
  }

  function updateAuthUIMode() {
    const titleEl = document.getElementById("authTitle");
    const submitBtn = document.getElementById("authSubmitBtn");
    const toggleText = document.getElementById("authToggleText");
    if (!titleEl) return;
    titleEl.textContent = authMode === "login" ? t("login_title") : t("register_title");
    submitBtn.textContent = authMode === "login" ? t("login_btn") : t("register_btn");
    toggleText.innerHTML = authMode === "login"
      ? `<span data-i18n="no_account">${t("no_account")}</span> <a id="authToggleLink" data-i18n="register_link">${t("register_link")}</a>`
      : `<span data-i18n="has_account">${t("has_account")}</span> <a id="authToggleLink" data-i18n="login_link">${t("login_link")}</a>`;
    document.getElementById("authToggleLink").addEventListener("click", () => {
      authMode = authMode === "login" ? "register" : "login";
      updateAuthUIMode();
      document.getElementById("authError").textContent = "";
    });
  }

  // ===================== GESTION DES DONNÉES AVEC SUPABASE =====================
  async function getCurrentUserId() {
    const { data: { user } } = await supabase.auth.getUser();
    return user?.id;
  }

  // Transactions
  async function loadTransactions() {
    const userId = await getCurrentUserId();
    if (!userId) return [];
    const { data, error } = await supabase
      .from('transactions')
      .select('*')
      .eq('user_id', userId)
      .order('date', { ascending: false });
    if (error) { console.error('Erreur chargement transactions:', error); return []; }
    return data;
  }

  async function addTransaction(tx) {
    const userId = await getCurrentUserId();
    if (!userId) return;
    const { error } = await supabase.from('transactions').insert([{ ...tx, user_id: userId }]);
    if (error) alert("Erreur ajout transaction: " + error.message);
    else await refreshUI();
  }

  async function deleteTransaction(id) {
    const { error } = await supabase.from('transactions').delete().eq('id', id);
    if (error) alert("Erreur suppression: " + error.message);
    else await refreshUI();
  }

  // Factures
  async function loadFactures() {
    const userId = await getCurrentUserId();
    if (!userId) return [];
    const { data, error } = await supabase
      .from('factures')
      .select('*')
      .eq('user_id', userId);
    if (error) { console.error('Erreur chargement factures:', error); return []; }
    return data;
  }

  async function addFacture(facture) {
    const userId = await getCurrentUserId();
    if (!userId) return;
    const { error } = await supabase.from('factures').insert([{ ...facture, user_id: userId }]);
    if (error) alert("Erreur ajout facture: " + error.message);
    else await refreshFactures();
  }

  async function updateFacture(id, updates) {
    const { error } = await supabase.from('factures').update(updates).eq('id', id);
    if (error) alert("Erreur mise à jour facture: " + error.message);
    else await refreshFactures();
  }

  async function deleteFacture(id) {
    const { error } = await supabase.from('factures').delete().eq('id', id);
    if (error) alert("Erreur suppression facture: " + error.message);
    else await refreshFactures();
  }

  // Profil
  async function loadUserProfile() {
    const { data: { user } } = await supabase.auth.getUser();
    return user?.user_metadata || {};
  }

  async function updateProfile(updates) {
    const { data: { user }, error } = await supabase.auth.updateUser({ data: updates });
    if (error) throw error;
    return user;
  }

  async function changePassword(newPassword) {
    const { error } = await supabase.auth.updateUser({ password: newPassword });
    if (error) throw error;
  }

  // ===================== FONCTIONS D'INTERFACE (adaptées async) =====================
  // Les fonctions refreshUI, refreshFactures, refreshAnalysis, etc. deviennent async
  // et utilisent les fonctions de données Supabase.

  let currentPeriod = "month";

  async function updateGlobalSummaryBar(txs) {
    const g = getSummary(txs, new Date(0), new Date(9999,11,31));
    document.getElementById("globalSoldeValue").textContent = formatMontant(g.solde);
    document.getElementById("globalRevenusValue").textContent = formatMontant(g.totalEntrees);
    document.getElementById("globalDepensesValue").textContent = formatMontant(g.totalSorties);
    const soldeEl = document.getElementById("globalSoldeValue");
    soldeEl.className = "summary-value " + (g.solde >= 0 ? "entrees" : "sorties");
  }

  // ... autres fonctions (updateResumeCard, refreshUI, refreshFactures, etc.) sont identiques mais async
  // (utilisent await loadTransactions() etc.)

  // ===================== INITIALISATION =====================
  async function initAuth() {
    document.getElementById("languageSelectAuth").value = getCurrentLanguage();
    document.getElementById("languageSelectAuth").addEventListener("change", (e) => {
      setCurrentLanguage(e.target.value);
      applyLanguage();
    });
    document.getElementById("authSubmitBtn").addEventListener("click", handleAuth);
    updateAuthUIMode();

    // Vérifier la session existante
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
      showMainApp();
    } else {
      showAuthScreen();
    }
  }

  function showAuthScreen() {
    document.getElementById("authScreen").style.display = "block";
    document.getElementById("mainApp").classList.add("hidden");
    document.getElementById("analysisScreen").classList.add("hidden");
    document.getElementById("facturesScreen").classList.add("hidden");
    document.getElementById("profileScreen").classList.add("hidden");
    document.getElementById("languageSelectAuth").value = getCurrentLanguage();
    applyLanguage();
  }

  async function showMainApp() {
    document.getElementById("authScreen").style.display = "none";
    document.getElementById("mainApp").classList.remove("hidden");
    document.getElementById("analysisScreen").classList.add("hidden");
    document.getElementById("facturesScreen").classList.add("hidden");
    document.getElementById("profileScreen").classList.add("hidden");
    document.getElementById("languageSelect").value = getCurrentLanguage();
    applyLanguage();
    await initMainApp();
    await refreshUI();
  }

  // ... (le reste des fonctions de navigation et d'initialisation, toutes async)

  // Démarrage
  document.addEventListener("DOMContentLoaded", () => {
    initAuth();
    applyLanguage();
  });

  // ===================== FONCTIONS UTILITAIRES (inchangées) =====================
  // getWeekRange, getMonthRange, getYearRange, getSummary, formatMontant, etc.
</script>
